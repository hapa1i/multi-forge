name: Tests

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_BUILD_CONSTRAINT: requirements/build.txt

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.18'
          checksum: c2def3db178ade63933fa15ffc96e882c196ce53e06173dcee05b36c5f6f68f5

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify dependency pins
        run: uv run --locked python scripts/check-dependency-pins.py

      - name: Run unit tests
        run: uv run --locked pytest tests/src -m "not integration" -v

      - name: Run regression tests
        run: uv run --locked pytest tests/regression -m regression -v

      - name: Verify clean wheel LiteLLM runtime
        run: ./scripts/test-wheel-runtime.sh

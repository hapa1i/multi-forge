[project]
name = "multi-forge"
version = "0.9.4"
description = "Multi-runtime agent toolkit: proxy routing, cost control, session management, policy enforcement, and workflow orchestration"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Habib Farr", email = "hapali@pm.me" },
]
# LiteLLM's CLI selects uvloop on non-Windows systems. Keep Python 3.14 outside
# the supported range until that clean-install/runtime matrix is verified.
# See https://github.com/hapa1i/multi-forge/issues/1
requires-python = ">=3.11,<3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
]

dependencies = [
    "dacite>=1.8.0",
    "click>=8.3.1",
    "coolname>=5.0.0,<6",
    "rich>=13.9.4,<14",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "tenacity>=8.0.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3,<7",
    "ruamel.yaml>=0.18.0",
    "packaging>=21.0",
    # Proxy dependencies (previously optional, now core). Forge owns the
    # default-Uvicorn LiteLLM startup set because the upstream `proxy` extra
    # caps cryptography below Forge's patched floor. Alternate servers,
    # databases, and cloud integrations remain outside Forge's runtime path.
    "aiohttp>=3.14.3,<4",
    "apscheduler>=3.11.2,<4",
    "backoff>=2.2.1,<3",
    "boto3>=1.43.1,<2",
    "cryptography>=50.0.0",
    "expression>=5.6.0,<6",
    # LiteLLM's proxy imports an internal FastAPI helper absent from newer
    # releases; keep the lock-proven FastAPI/Starlette pair together.
    "fastapi>=0.136.3,<0.137",
    "fastapi-sso>=0.19.0,<1",
    "orjson>=3.11.6,<4",
    "pydantic-settings>=2.14.1,<3",
    "pyjwt>=2.13.0,<3",
    "python-multipart>=0.0.31,<1",
    "redis>=5.2.0,<8",
    "starlette>=1.3.1,<1.4",
    "uvicorn>=0.33.0,<1",
    "uvloop>=0.21.0,<1; sys_platform != 'win32'",
    "watchfiles>=0.20",
    "websockets>=15.0.1,<16",
    # Floor = the gate-proven version for gemini-3.6-flash (see
    # tests/integration/proxy/test_proxy_local_litellm_e2e.py); packaged
    # cost-map pricing for that model first ships in the v1.94 line.
    "litellm>=1.88.0",
]

[project.scripts]
forge = "forge.cli.main:main"

[project.urls]
Homepage = "https://github.com/hapa1i/multi-forge"
Repository = "https://github.com/hapa1i/multi-forge"
Issues = "https://github.com/hapa1i/multi-forge/issues"
Documentation = "https://github.com/hapa1i/multi-forge/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

# Include non-Python data files (YAML catalogs, etc.) in the wheel
[tool.hatch.build.targets.wheel.sources]
"src" = ""

# Bundle extension files (skills, agents, commands) into the wheel.
# These live outside src/forge/ in the repo but must be accessible from
# a wheel install for `forge extension enable` to work.
[tool.hatch.build.targets.wheel.force-include]
"src/skills" = "forge/_extensions/skills"
"src/agents" = "forge/_extensions/agents"
"src/commands" = "forge/_extensions/commands"

[tool.hatch.build]
include = [
    "src/forge/**/*.py",
    "src/forge/**/*.yaml",
    "src/forge/**/*.md",
    # Extensions are bundled into wheels via force-include above; they must
    # also be included here so source distributions ship them. Without this,
    # `pip install --no-binary=:all:` (or anyone building from sdist) would
    # produce a wheel missing all extensions.
    "src/skills/**",
    "src/agents/**",
    "src/commands/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (require network/API access, deselect with '-m \"not slow\"')",
    "remote_litellm: marks tests that require remote/shared LiteLLM infrastructure",
    "regression: marks tests as regression/bug-fix tests (run with '-m regression')",
    "docker_in: tests that exec commands inside a container (use '-m \"not docker_in\"' to skip)",
    "docker_host: tests that spawn containers from host - sandbox tests (use '-m \"not docker_host\"' to skip)",
]

[tool.pytest-asyncio]
asyncio_mode = "auto"

[tool.mypy]
# Same-named standalone scripts in separate skill directories collide in mypy's
# module map during broad scans. Keep this exclusion local to the duplicate
# script name; it is not a source-of-truth relationship between the skills.
exclude = [
    'src/skills/qa/scripts/walkthrough-state\.py$',
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

# Security floor for transitive dependencies (Dependabot alerts)
[tool.uv]
constraint-dependencies = [
    "filelock>=3.20.3",
    "virtualenv>=20.36.1",
    "aiohttp>=3.14.3",
    "cryptography>=50.0.0",
    "mcp>=1.28.1",
    "python-multipart>=0.0.31",
    "Pygments>=2.20.0",
    "PyJWT>=2.13.0",
    "starlette>=1.3.1",
    "pyasn1>=0.6.4",
]
# litellm proxy extras can pin vulnerable transitive dependencies before
# upstream metadata catches up. Forge doesn't use these directly; override to
# force patched versions required by Dependabot alerts.
override-dependencies = [
    "cryptography>=50.0.0",
    "fastapi-sso>=0.19.0",
    "python-multipart>=0.0.31",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.0",
    "black>=26.5.0",
    "mypy>=1.13.0",
    "pyright>=1.1.0",
    "pytest-rerunfailures>=14.0",
    "pre-commit>=4.5.0",
    "types-PyYAML>=6.0.0",
    "types-requests>=2.31.0",
    "python-dotenv>=1.2.1",
    "httpx2>=2.3.0",
]
provider-check = [
    "anthropic>=0.100.0",
    "google-genai>=2.5.0",
    "openai>=2.0.0",
    "tiktoken>=0.12.0",
]

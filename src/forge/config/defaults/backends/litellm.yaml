# LiteLLM Local Proxy Configuration
# For use with personal API keys (Gemini, Anthropic, and/or OpenAI)
#
# Supported models:
#   Gemini (requires GEMINI_API_KEY):
#     - gemini/gemini-3.1-pro-preview
#     - gemini/gemini-3.1-pro-preview-customtools (optimized for custom tools + bash)
#     - gemini/gemini-3-flash-preview
#     - gemini/gemini-3.7-flash (Gemini Flash default)
#     - gemini/gemini-3.6-flash (Gemini 3.6 Flash - efficiency release)
#     - gemini/gemini-3.5-flash
#     - gemini/gemini-2.5-flash
#     - gemini/gemini-2.5-pro
#
#   Anthropic (requires ANTHROPIC_API_KEY):
#     - anthropic/claude-haiku-4-5, claude-sonnet-5, claude-opus-5
#     - anthropic/claude-fable-5-1, claude-fable-5
#     - anthropic/claude-opus-4-8, claude-opus-4-6, claude-sonnet-4-6
#
#   OpenAI (requires OPENAI_API_KEY):
#     - openai/gpt-5, gpt-5-codex, gpt-5-mini, gpt-5-nano, gpt-5-pro
#     - openai/gpt-5.1, gpt-5.1-codex, gpt-5.1-codex-max, gpt-5.1-codex-mini
#     - openai/gpt-5.2, gpt-5.2-codex, gpt-5.2-pro
#     - openai/gpt-5.3-codex
#     - openai/gpt-5.4, gpt-5.4-pro
#     - openai/gpt-5.5
#     - openai/gpt-5.6, gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna
#
# Start with: forge model backend start litellm --port 4000

model_list:
  # Gemini 3.1 Pro Preview
  - model_name: gemini/gemini-3.1-pro-preview
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: os.environ/GEMINI_API_KEY

  # Gemini 3.1 Pro Preview (Custom Tools) - optimized for agentic workflows with custom tools + bash
  - model_name: gemini/gemini-3.1-pro-preview-customtools
    litellm_params:
      model: gemini/gemini-3.1-pro-preview-customtools
      api_key: os.environ/GEMINI_API_KEY

  # Gemini 3 Flash Preview
  - model_name: gemini/gemini-3-flash-preview
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: os.environ/GEMINI_API_KEY

  # Gemini 3.7 Flash - current Flash default
  - model_name: gemini/gemini-3.7-flash
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: os.environ/GEMINI_API_KEY

  # Gemini 3.6 Flash - efficiency release built on 3.5 Flash
  - model_name: gemini/gemini-3.6-flash
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY

  # Gemini 3.5 Flash
  - model_name: gemini/gemini-3.5-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # Gemini 2.5 Flash
  - model_name: gemini/gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # Gemini 2.5 Pro
  - model_name: gemini/gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  # Aliases for convenience (match config.yaml model names)
  - model_name: gemini-3.1-pro-preview
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3.1-pro-preview-customtools
    litellm_params:
      model: gemini/gemini-3.1-pro-preview-customtools
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3-flash-preview
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3.7-flash
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3.6-flash
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3.5-flash
    litellm_params:
      model: gemini/gemini-3.5-flash

# LiteLLM Local Proxy Configuration
# For use with personal API keys (Gemini, Anthropic, and/or OpenAI)
#
# Supported models:
#   Gemini (requires GEMINI_API_KEY):
#     - gemini/gemini-3.1-pro-preview
#     - gemini/gemini-3.1-pro-preview-customtools (optimized for custom tools + bash)
#     - gemini/gemini-3-flash-preview
#     - gemini/gemini-3.8-flash (LiteLLM Flash default)
#     - gemini/gemini-3.7-flash
#     - gemini/gemini-3.6-flash (Gemini 3.6 Flash - efficiency release)
#     - gemini/gemini-3.5-flash
#     - gemini/gemini-2.5-flash
#     - gemini/gemini-2.5-pro
#
#   Anthropic (requires ANTHROPIC_API_KEY):
#     - anthropic/claude-haiku-4-5, claude-sonnet-5, claude-opus-5-5, claude-opus-5
#     - anthropic/claude-fable-5-1, claude-fable-5
#     - anthropic/claude-opus-4-8, claude-opus-4-6, claude-sonnet-4-6
#
#   OpenAI (requires OPENAI_API_KEY):
#     - openai/gpt-5, gpt-5-codex, gpt-5-mini, gpt-5-nano, gpt-5-pro
#     - openai/gpt-5.1, gpt-5.1-codex, gpt-5.1-codex-max, gpt-5.1-codex-mini
#     - openai/gpt-5.2, gpt-5.2-codex, gpt-5.2-pro
#     - openai/gpt-5.3-codex
#     - openai/gpt-5.4, gpt-5.4-pro
#     - openai/gpt-5.5
#     - openai/gpt-5.6, gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna
#     - openai/gpt-6-astra, gpt-6-sol, gpt-6-luna
#
# Start with: forge model backend start litellm --port 4000

model_list:
  # Gemini 3.1 Pro Preview
  - model_name: gemini/gemini-3.1-pro-preview
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: os.environ/GEMINI_API_KEY

  # Gemini 3.1 Pro Preview (Custom Tools) - optimized for agentic workflows with custom tools + bash
  - model_name: gemini/gemini-3.1-pro-preview-customtools
    litellm_params:
      model: gemini/gemini-3.1-pro-preview-customtools
      api_key: os.environ/GEMINI_API_KEY

  # Gemini 3 Flash Preview
  - model_name: gemini/gemini-3-flash-preview
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: os.environ/GEMINI_API_KEY

  # Gemini 3.8 Flash - current LiteLLM Flash default
  - model_name: gemini/gemini-3.8-flash
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY

  # Gemini 3.7 Flash
  - model_name: gemini/gemini-3.7-flash
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: os.environ/GEMINI_API_KEY

  # Gemini 3.6 Flash - efficiency release built on 3.5 Flash
  - model_name: gemini/gemini-3.6-flash
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY

  # Gemini 3.5 Flash
  - model_name: gemini/gemini-3.5-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # Gemini 2.5 Flash
  - model_name: gemini/gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # Gemini 2.5 Pro
  - model_name: gemini/gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  # Aliases for convenience (match config.yaml model names)
  - model_name: gemini-3.1-pro-preview
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3.1-pro-preview-customtools
    litellm_params:
      model: gemini/gemini-3.1-pro-preview-customtools
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3-flash-preview
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3.8-flash
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3.7-flash
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3.6-flash
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3.5-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  # =========================================================================
  # Anthropic Models (requires ANTHROPIC_API_KEY)
  # =========================================================================

  - model_name: anthropic/claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: anthropic/claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # LiteLLM 1.102 predates Opus 5.5. Keep its pricing and thinking contract available offline.
  # https://platform.claude.com/docs/en/models/opus-5-5/overview (verified 2026-09-23)
  - model_name: anthropic/claude-opus-5-5
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      base_model: claude-opus-5-5
      mode: chat
      max_input_tokens: 1000000
      max_output_tokens: 128000
      max_tokens: 128000
      input_cost_per_token: 0.000004
      output_cost_per_token: 0.000020
      cache_creation_input_token_cost: 0.000005
      cache_creation_input_token_cost_above_1hr: 0.000008
      cache_read_input_token_cost: 0.0000002
      supports_vision: true
      supports_function_calling: true
      supports_tool_choice: true
      supports_prompt_caching: true
      prompt_cache_min_tokens: 512
      supports_reasoning: true
      supports_adaptive_thinking: true
      supports_legacy_thinking: false
      thinking_always_on: true
      supports_output_config: true
      supports_xhigh_reasoning_effort: true
      supports_max_reasoning_effort: true
      default_reasoning_effort: medium
      reasoning_effort_levels: [low, medium, high, xhigh, max]
      supports_response_schema: true
      supports_native_structured_output: true
      supports_assistant_prefill: false
      provider_specific_entry:
        us: 1.1
        fast: 2.0

  - model_name: anthropic/claude-opus-5
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: anthropic/claude-fable-5-1
    litellm_params:
      model: anthropic/claude-fable-5-1
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: anthropic/claude-fable-5
    litellm_params:
      model: anthropic/claude-fable-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: anthropic/claude-opus-4-8
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: anthropic/claude-opus-4-6
    litellm_params:
      model: anthropic/claude-opus-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: anthropic/claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  # =========================================================================
  # OpenAI Models (requires OPENAI_API_KEY)
  # =========================================================================

  # --- GPT-5 family ---
  - model_name: openai/gpt-5
    litellm_params:
      model: openai/gpt-5
      api_key: os.environ/OPENAI_API_KEY

  - model_name: openai/gpt-5-codex
    litellm_params:
      model: openai/gpt-5-codex
      api_key: os.environ/OPENAI_API_KEY

  - model_name: openai/gpt-5-mini
    litellm_params:
      model: openai/gpt-5-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: openai/gpt-5-nano
    litellm_params:
      model: openai/gpt-5-nano
      api_key: os.environ/OPENAI_API_KEY

  - model_name: openai/gpt-5-pro
    litellm_params:
      model: openai/gpt-5-pro
      api_key: os.environ/OPENAI_API_KEY

  # --- GPT-5.1 family ---
  - model_name: openai/gpt-5.1
    litellm_params:
      model: openai/gpt-5.1
      api_key: os.environ/OPENAI_API_KEY

  - model_name: openai/gpt-5.1-codex
    litellm_params:
      model: openai/gpt-5.1-codex
      api_key: os.environ/OPENAI_API_KEY

  - model_name: openai/gpt-5.1-codex-max
    litellm_params:
      model: openai/gpt-5.1-codex-max
      api_key: os.environ/OPENAI_API_KEY

  - model_name: openai/gpt-5.1-codex-mini
    litellm_params:
      model: openai/gpt-5.1-codex-mini
      api_key: os.environ/OPENAI_API_KEY

  # --- GPT-5.2 family ---
  - model_name: openai/gpt-5.2
    litellm_params:
      model: openai/gpt-5.2
      api_key: os.environ/OPENAI_API_KEY

  - model_name: openai/gpt-5.2-codex
    litellm_params:
      model: openai/gpt-5.2-codex
      api_key: os.environ/OPENAI_API_KEY

  - model_name: openai/gpt-5.2-pro
    litellm_params:
      model: openai/gpt-5.2-pro
      api_key: os.environ/OPENAI_API_KEY

  # --- GPT-5.3 family ---
  - model_name: openai/gpt-5.3-codex
    litellm_params:
      model: openai/gpt-5.3-codex
      api_key: os.environ/OPENAI_API_KEY

  # --- GPT-5.4 family ---
  - model_name: openai/gpt-5.4
    litellm_params:
      model: openai/gpt-5.4
      api_key: os.environ/OPENAI_API_KEY

  - model_name: openai/gpt-5.4-pro
    litellm_params:
      model: openai/gpt-5.4-pro
      api_key: os.environ/OPENAI_API_KEY

  - model_name: openai/gpt-5.4-mini
    litellm_params:
      model: openai/gpt-5.4-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: openai/gpt-5.4-nano
    litellm_params:
      model: openai/gpt-5.4-nano
      api_key: os.environ/OPENAI_API_KEY

  # --- GPT-5.5 ---
  - model_name: openai/gpt-5.5
    litellm_params:
      model: openai/gpt-5.5
      api_key: os.environ/OPENAI_API_KEY

  # --- GPT-5.6 family ---
  - model_name: openai/gpt-5.6
    litellm_params:
      model: openai/gpt-5.6
      api_key: os.environ/OPENAI_API_KEY

  - model_name: openai/gpt-5.6-sol
    litellm_params:
      model: openai/gpt-5.6-sol
      api_key: os.environ/OPENAI_API_KEY

  - model_name: openai/gpt-5.6-terra
    litellm_params:
      model: openai/gpt-5.6-terra
      api_key: os.environ/OPENAI_API_KEY

  - model_name: openai/gpt-5.6-luna
    litellm_params:
      model: openai/gpt-5.6-luna
      api_key: os.environ/OPENAI_API_KEY

  - model_name: openai/gpt-6-astra
    litellm_params:
      model: openai/gpt-6-astra
      api_key: os.environ/OPENAI_API_KEY

  # LiteLLM 1.102 predates Sol and Luna. Standard, Flex and Fast rates include the >272k-token premium.
  # Flex costs half of standard; Fast (also called priority) costs twice the applicable rate.
  # Remove these overrides when bundled metadata covers them; test_litellm_model_metadata pins that boundary.
  # https://developers.openai.com/api/docs/models/gpt-6-sol (verified 2026-09-23)
  - model_name: openai/gpt-6-sol
    litellm_params:
      model: openai/gpt-6-sol
      api_key: os.environ/OPENAI_API_KEY
      use_responses_api: true
    model_info:
      base_model: gpt-6-sol
      mode: responses
      max_input_tokens: 922000
      max_output_tokens: 128000
      max_tokens: 128000
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000010
      cache_read_input_token_cost: 0.0000002
      cache_creation_input_token_cost: 0.0000025
      input_cost_per_token_above_272k_tokens: 0.000004
      output_cost_per_token_above_272k_tokens: 0.000015
      cache_read_input_token_cost_above_272k_tokens: 0.0000004
      cache_creation_input_token_cost_above_272k_tokens: 0.000005
      input_cost_per_token_flex: 0.000001
      output_cost_per_token_flex: 0.000005
      cache_read_input_token_cost_flex: 0.0000001
      cache_creation_input_token_cost_flex: 0.00000125
      input_cost_per_token_above_272k_tokens_flex: 0.000002
      output_cost_per_token_above_272k_tokens_flex: 0.0000075
      cache_read_input_token_cost_above_272k_tokens_flex: 0.0000002
      cache_creation_input_token_cost_above_272k_tokens_flex: 0.0000025
      input_cost_per_token_priority: 0.000004
      output_cost_per_token_priority: 0.000020
      cache_read_input_token_cost_priority: 0.0000004
      cache_creation_input_token_cost_priority: 0.000005
      input_cost_per_token_above_272k_tokens_priority: 0.000008
      output_cost_per_token_above_272k_tokens_priority: 0.000030
      cache_read_input_token_cost_above_272k_tokens_priority: 0.0000008
      cache_creation_input_token_cost_above_272k_tokens_priority: 0.000010
      supports_vision: true
      supports_function_calling: true
      supports_parallel_function_calling: true
      supports_tool_choice: true
      supports_prompt_caching: true
      supports_reasoning: true
      supports_none_reasoning_effort: true
      supports_xhigh_reasoning_effort: true
      supports_max_reasoning_effort: true
      default_reasoning_effort: medium
      reasoning_effort_levels: [none, low, medium, high, xhigh, max]
      supports_response_schema: true

  # https://developers.openai.com/api/docs/models/gpt-6-luna (verified 2026-09-23)
  - model_name: openai/gpt-6-luna
    litellm_params:
      model: openai/gpt-6-luna
      api_key: os.environ/OPENAI_API_KEY
      use_responses_api: true
    model_info:
      base_model: gpt-6-luna
      mode: responses
      max_input_tokens: 922000
      max_output_tokens: 128000
      max_tokens: 128000
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000005
      cache_read_input_token_cost: 0.00000001
      cache_creation_input_token_cost: 0.000000125
      input_cost_per_token_above_272k_tokens: 0.0000002
      output_cost_per_token_above_272k_tokens: 0.00000075
      cache_read_input_token_cost_above_272k_tokens: 0.00000002
      cache_creation_input_token_cost_above_272k_tokens: 0.00000025
      input_cost_per_token_flex: 0.00000005
      output_cost_per_token_flex: 0.00000025
      cache_read_input_token_cost_flex: 0.000000005
      cache_creation_input_token_cost_flex: 0.0000000625
      input_cost_per_token_above_272k_tokens_flex: 0.0000001
      output_cost_per_token_above_272k_tokens_flex: 0.000000375
      cache_read_input_token_cost_above_272k_tokens_flex: 0.00000001
      cache_creation_input_token_cost_above_272k_tokens_flex: 0.000000125
      input_cost_per_token_priority: 0.0000002
      output_cost_per_token_priority: 0.000001
      cache_read_input_token_cost_priority: 0.00000002
      cache_creation_input_token_cost_priority: 0.00000025
      input_cost_per_token_above_272k_tokens_priority: 0.0000004
      output_cost_per_token_above_272k_tokens_priority: 0.0000015
      cache_read_input_token_cost_above_272k_tokens_priority: 0.00000004
      cache_creation_input_token_cost_above_272k_tokens_priority: 0.0000005
      supports_vision: true
      supports_function_calling: true
      supports_parallel_function_calling: true
      supports_tool_choice: true
      supports_prompt_caching: true
      supports_reasoning: true
      supports_none_reasoning_effort: true
      supports_xhigh_reasoning_effort: true
      supports_max_reasoning_effort: true
      default_reasoning_effort: medium
      reasoning_effort_levels: [none, low, medium, high, xhigh, max]
      supports_response_schema: true

litellm_settings:
  # Drop unmapped params instead of erroring
  drop_params: true

  set_verbose: false

  request_timeout: 600


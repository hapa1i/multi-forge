# Template: openrouter-qwen
# Qwen models via OpenRouter (direct, no LiteLLM)
#
# Haiku keeps Qwen3.6 Flash for fast, inexpensive multimodal work. Sonnet uses
# Qwen3.8 27B; Opus is configured as the Qwen3.8 Max flagship. OpenRouter has
# no ZDR endpoint for Max as of 2026-08-21, so required-ZDR mode resolves Opus
# to the same-price open-weight 2.4T A95B variant before dispatch. That
# fallback is text-only; use 27B as the mapping target when vision is required.
# The displaced Qwen3.7/3.6 models and qwen3-coder remain explicit alternatives.
# Requires OPENROUTER_API_KEY in .env (or environment).

proxy:
  family: qwen
  preferred_provider: openrouter
  backend: openrouter
  default_port: 8101

  openrouter:
    allow_non_zdr: false
    tiers:
      haiku: qwen/qwen3.6-flash
      sonnet: qwen/qwen3.8-27b
      opus: qwen/qwen3.8-max
    zdr_fallbacks:
      qwen/qwen3.8-max: qwen/qwen3.8-2.4t-a95b
    model_alternatives:
      sonnet:
        qwen3.7-plus: qwen/qwen3.7-plus
        qwen3.6-plus: qwen/qwen3.6-plus
        qwen3-coder: qwen/qwen3-coder
      opus:
        qwen3.7-max: qwen/qwen3.7-max
        qwen3.6-max-preview: qwen/qwen3.6-max-preview
        qwen3-coder: qwen/qwen3-coder
    error_hints: true

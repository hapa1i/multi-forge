# Template: litellm-gemini-flash-local
# Gemini 3.7 Flash via local LiteLLM
#
# Requires:
#   - GEMINI_API_KEY in .env
#
# Backend (LiteLLM on port 4000) starts automatically.
# All tiers use Flash, differentiated by reasoning_effort.
#
# After adding GEMINI_API_KEY, stop the backend so Forge restarts it with the new environment:
# forge model backend stop litellm-4000

proxy:
  family: gemini
  preferred_provider: litellm
  backend: litellm-gemini-local
  default_port: 8088

  litellm:
    tiers:
      haiku: gemini/gemini-3.7-flash
      sonnet: gemini/gemini-3.7-flash
      opus: gemini/gemini-3.7-flash
    # All tiers use the same model with different reasoning levels.
    tier_overrides:
      haiku:
        reasoning_effort: low
      sonnet:
        reasoning_effort: medium
      opus:
        reasoning_effort: high

# Template: litellm-openai
# OpenAI models via remote/shared LiteLLM
#
# Native GPT-6.2 models and retained GPT/O-series deployments.
# Requires LITELLM_API_KEY and LITELLM_BASE_URL in .env (or environment).
#
# Haiku uses gpt-5.4-mini. Sonnet and Opus use gpt-6.2-astra,
# differentiated by tier_overrides (reasoning_effort and verbosity).

proxy:
  family: openai
  preferred_provider: litellm
  backend: litellm-remote
  default_port: 8085

  litellm:
    tiers:
      haiku: openai/gpt-5.4-mini
      sonnet: openai/gpt-6.2-astra
      opus: openai/gpt-6.2-astra
    model_alternatives:
      haiku:
        gpt-6-luna: openai/gpt-6-luna
      sonnet:
        gpt-6.2-sol: openai/gpt-6.2-sol
        gpt-6-astra: openai/gpt-6-astra
        gpt-6.1-sol: openai/gpt-6.1-sol
        gpt-6-sol: openai/gpt-6-sol
        gpt-6-luna: openai/gpt-6-luna
        gpt-5.6-sol: openai/gpt-5.6-sol
      opus:
        gpt-6.2-sol: openai/gpt-6.2-sol
        gpt-6-astra: openai/gpt-6-astra
        gpt-6.1-sol: openai/gpt-6.1-sol
        gpt-6-sol: openai/gpt-6-sol
        gpt-6-luna: openai/gpt-6-luna
        gpt-5.6-sol: openai/gpt-5.6-sol
    tier_overrides:
      sonnet:
        reasoning_effort: medium
        verbosity: high
      opus:
        reasoning_effort: high
        verbosity: high
    error_hints: true

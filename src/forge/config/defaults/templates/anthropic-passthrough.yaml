# Template: anthropic-passthrough
# Direct Anthropic Messages API passthrough.
#
# Forwards raw Anthropic requests to api.anthropic.com without OpenAI translation.
# Thinking blocks and unknown fields remain byte-for-byte so signatures stay valid.
# This is the only wire shape that preserves signed reasoning.
#
# `provider: litellm` selects credential and upstream resolution.
# `wire_shape: anthropic_passthrough` defines the wire format reported by GET /.
# Tiers are informational because the client model is forwarded unchanged.
# No model_alternatives remap applies to this wire shape.
# This template requires ANTHROPIC_API_KEY in .env or the environment.

proxy:
  family: anthropic
  preferred_provider: litellm
  backend: anthropic-passthrough
  default_port: 8096
  wire_shape: anthropic_passthrough

  # 'inspect' hashes outbound system prompts and tool surfaces to detect drift.
  # It records metadata without mutating the body. Use 'override' to apply body
  # controls; only anthropic_passthrough supports that mode.
  intercept:
    mode: inspect

  litellm:
    tiers:
      haiku: claude-haiku-4-5
      sonnet: claude-sonnet-5
      opus: claude-opus-5

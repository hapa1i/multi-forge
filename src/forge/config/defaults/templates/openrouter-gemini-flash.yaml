# Template: openrouter-gemini-flash
# Gemini Flash models via OpenRouter (all tiers use Flash)
#
# Requires OPENROUTER_API_KEY in .env (or environment).
#
# All tiers use Flash, differentiated by reasoning_effort.
# Gemini 3.8 is the default; earlier cataloged Flash releases remain selectable.

proxy:
  family: gemini
  preferred_provider: openrouter
  backend: openrouter
  default_port: 8099

  openrouter:
    allow_non_zdr: false
    tiers:
      haiku: google/gemini-3.8-flash
      sonnet: google/gemini-3.8-flash
      opus: google/gemini-3.8-flash
    model_alternatives:
      haiku:
        gemini-2.5-flash: google/gemini-2.5-flash
        gemini-3.5-flash: google/gemini-3.5-flash
        gemini-3.6-flash: google/gemini-3.6-flash
        gemini-3.7-flash: google/gemini-3.7-flash
      sonnet:
        gemini-2.5-flash: google/gemini-2.5-flash
        gemini-3.5-flash: google/gemini-3.5-flash
        gemini-3.6-flash: google/gemini-3.6-flash
        gemini-3.7-flash: google/gemini-3.7-flash
      opus:
        gemini-2.5-flash: google/gemini-2.5-flash
        gemini-3.5-flash: google/gemini-3.5-flash
        gemini-3.6-flash: google/gemini-3.6-flash
        gemini-3.7-flash: google/gemini-3.7-flash
    tier_overrides:
      haiku:
        reasoning_effort: low
      sonnet:
        reasoning_effort: medium
      opus:
        reasoning_effort: high
    error_hints: true

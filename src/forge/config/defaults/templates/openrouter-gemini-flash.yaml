# Template: openrouter-gemini-flash
# Gemini Flash-position models via OpenRouter (all tiers use one model)
#
# Requires OPENROUTER_API_KEY in .env (or environment).
#
# All tiers use Gemini 4 Hydrogen, differentiated by reasoning_effort.
# Gemini 3.8 Flash and earlier cataloged Flash releases remain selectable.

proxy:
  family: gemini
  preferred_provider: openrouter
  backend: openrouter
  default_port: 8099

  openrouter:
    allow_non_zdr: false
    tiers:
      haiku: google/gemini-4-hydrogen
      sonnet: google/gemini-4-hydrogen
      opus: google/gemini-4-hydrogen
    model_alternatives:
      haiku:
        gemini-2.5-flash: google/gemini-2.5-flash
        gemini-3.5-flash: google/gemini-3.5-flash
        gemini-3.6-flash: google/gemini-3.6-flash
        gemini-3.7-flash: google/gemini-3.7-flash
        gemini-3.8-flash: google/gemini-3.8-flash
      sonnet:
        gemini-2.5-flash: google/gemini-2.5-flash
        gemini-3.5-flash: google/gemini-3.5-flash
        gemini-3.6-flash: google/gemini-3.6-flash
        gemini-3.7-flash: google/gemini-3.7-flash
        gemini-3.8-flash: google/gemini-3.8-flash
      opus:
        gemini-2.5-flash: google/gemini-2.5-flash
        gemini-3.5-flash: google/gemini-3.5-flash
        gemini-3.6-flash: google/gemini-3.6-flash
        gemini-3.7-flash: google/gemini-3.7-flash
        gemini-3.8-flash: google/gemini-3.8-flash
    tier_overrides:
      haiku:
        reasoning_effort: low
      sonnet:
        reasoning_effort: medium
      opus:
        reasoning_effort: high
    error_hints: true

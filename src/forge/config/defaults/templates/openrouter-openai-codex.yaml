# Template: openrouter-openai-codex
# OpenAI Codex models via OpenRouter (direct, no LiteLLM)
#
# Requires OPENROUTER_API_KEY in .env (or environment).

proxy:
  family: openai
  preferred_provider: openrouter
  backend: openrouter
  default_port: 8098

  openrouter:
    allow_non_zdr: false
    tiers:
      haiku: openai/gpt-5.1-codex-mini
      sonnet: openai/gpt-5.3-codex
      opus: openai/gpt-6-astra
    model_alternatives:
      haiku:
        gpt-6-luna: openai/gpt-6-luna
        gpt-6-luna-pro: openai/gpt-6-luna-pro
      sonnet:
        gpt-6-sol: openai/gpt-6-sol
        gpt-6-sol-pro: openai/gpt-6-sol-pro
        gpt-6-luna: openai/gpt-6-luna
        gpt-6-luna-pro: openai/gpt-6-luna-pro
      opus:
        gpt-6-sol: openai/gpt-6-sol
        gpt-6-sol-pro: openai/gpt-6-sol-pro
        gpt-6-luna: openai/gpt-6-luna
        gpt-6-luna-pro: openai/gpt-6-luna-pro
        gpt-5.6-sol: openai/gpt-5.6-sol
        gpt-6-astra-pro: openai/gpt-6-astra-pro
    tier_overrides:
      sonnet:
        reasoning_effort: medium
      opus:
        reasoning_effort: high
        verbosity: high
    error_hints: true

# Template: openrouter-gemini
# Google Gemini models via OpenRouter (direct, no LiteLLM)
#
# Access to Gemini 4 Carbon and Gemini 3.8 Flash.
# Requires OPENROUTER_API_KEY in .env (or environment).

proxy:
  family: gemini
  preferred_provider: openrouter
  backend: openrouter
  default_port: 8097

  openrouter:
    allow_non_zdr: false
    tiers:
      haiku: google/gemini-3.8-flash
      sonnet: google/gemini-4-carbon
      opus: google/gemini-4-carbon
    model_alternatives:
      sonnet:
        gemini-4-argon: google/gemini-4-argon
        gemini-3.1-pro-preview: google/gemini-3.1-pro-preview
        gemini-2.5-pro: google/gemini-2.5-pro
      opus:
        gemini-4-argon: google/gemini-4-argon
        gemini-3.1-pro-preview: google/gemini-3.1-pro-preview
        gemini-2.5-pro: google/gemini-2.5-pro
    tier_overrides:
      sonnet:
        reasoning_effort: medium
      opus:
        reasoning_effort: high
    error_hints: true

# Template: openrouter-kimi
# Kimi models via OpenRouter (direct, no LiteLLM)
#
# Haiku uses Gemma 4 31B as a shared low-cost multimodal tier. Sonnet/opus use
# Kimi K3 as the higher-capability Kimi tier. The coding-specialized K2.7 Code,
# plus K2.6 and K2.5, are available as sonnet/opus model_alternatives for
# explicit proxy requests.
# Requires OPENROUTER_API_KEY in .env (or environment).

proxy:
  family: kimi
  preferred_provider: openrouter
  backend: openrouter
  default_port: 8102

  openrouter:
    allow_non_zdr: false
    tiers:
      haiku: google/gemma-4-31b-it
      sonnet: moonshotai/kimi-k3
      opus: moonshotai/kimi-k3
    model_alternatives:
      sonnet:
        kimi-k2.7-code: moonshotai/kimi-k2.7-code
        kimi-k2.6: moonshotai/kimi-k2.6
        kimi-k2.5: moonshotai/kimi-k2.5
      opus:
        kimi-k2.7-code: moonshotai/kimi-k2.7-code
        kimi-k2.6: moonshotai/kimi-k2.6
        kimi-k2.5: moonshotai/kimi-k2.5
    tier_overrides:
      sonnet:
        reasoning_effort: high
      opus:
        reasoning_effort: high
    error_hints: true

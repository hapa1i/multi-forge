# Template: litellm-openai-codex-local
# OpenAI Codex models via local LiteLLM with personal API key (DEVELOPMENT)
#
# Requires:
#   - OPENAI_API_KEY in .env
#
# Backend (LiteLLM on port 4000) starts automatically.
#
# After adding OPENAI_API_KEY, stop the backend so Forge restarts it with the new environment:
# forge model backend stop litellm-4000

proxy:
  family: openai
  preferred_provider: litellm
  backend: litellm-openai-local
  default_port: 8090

  litellm:
    tiers:
      haiku: openai/gpt-5.1-codex-mini
      sonnet: openai/gpt-5.3-codex
      opus: openai/gpt-6-astra
    model_alternatives:
      opus:
        gpt-5.6-sol: openai/gpt-5.6-sol
    tier_overrides:
      sonnet:
        reasoning_effort: medium
      opus:
        reasoning_effort: high
        verbosity: high
    error_hints: true

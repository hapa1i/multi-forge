# Template: litellm-gemini
# Gemini models via remote/shared LiteLLM
#
# Default template for Gemini access through a shared LiteLLM gateway.
# The shared instance must serve vertex_ai/gemini-3.8-flash.
# Requires LITELLM_API_KEY and LITELLM_BASE_URL in .env (or environment).

proxy:
  family: gemini
  preferred_provider: litellm
  backend: litellm-remote
  default_port: 8084

  litellm:
    tiers:
      haiku: vertex_ai/gemini-3.8-flash
      sonnet: vertex_ai/gemini-3.1-pro-preview
      opus: vertex_ai/gemini-3.1-pro-preview
    model_alternatives:
      haiku:
        gemini-2.5-flash: vertex_ai/gemini-2.5-flash
        gemini-3.5-flash: vertex_ai/gemini-3.5-flash
        gemini-3.6-flash: vertex_ai/gemini-3.6-flash
        gemini-3.7-flash: vertex_ai/gemini-3.7-flash
      sonnet:
        gemini-3.8-flash: vertex_ai/gemini-3.8-flash
        gemini-2.5-flash: vertex_ai/gemini-2.5-flash
        gemini-3.5-flash: vertex_ai/gemini-3.5-flash
        gemini-3.6-flash: vertex_ai/gemini-3.6-flash
        gemini-3.7-flash: vertex_ai/gemini-3.7-flash
      opus:
        gemini-3.8-flash: vertex_ai/gemini-3.8-flash
        gemini-2.5-flash: vertex_ai/gemini-2.5-flash
        gemini-3.5-flash: vertex_ai/gemini-3.5-flash
        gemini-3.6-flash: vertex_ai/gemini-3.6-flash
        gemini-3.7-flash: vertex_ai/gemini-3.7-flash
    tier_overrides:
      sonnet:
        reasoning_effort: medium
      opus:
        reasoning_effort: high

# Template: openrouter-openai
# OpenAI models via OpenRouter (direct, no LiteLLM)
#
# Access to GPT-6 Astra and GPT-5.4-mini.
# Requires OPENROUTER_API_KEY in .env (or environment).
#
# Haiku uses gpt-5.4-mini; sonnet and opus both use gpt-6-astra,
# differentiated by tier_overrides (reasoning_effort and verbosity).

proxy:
  family: openai
  preferred_provider: openrouter
  backend: openrouter
  default_port: 8096

  openrouter:
    allow_non_zdr: false
    tiers:
      haiku: openai/gpt-5.4-mini
      sonnet: openai/gpt-6-astra
      opus: openai/gpt-6-astra
    model_alternatives:
      sonnet:
        gpt-5.6-sol: openai/gpt-5.6-sol
        gpt-6-astra-pro: openai/gpt-6-astra-pro
      opus:
        gpt-5.6-sol: openai/gpt-5.6-sol
        gpt-6-astra-pro: openai/gpt-6-astra-pro
    tier_overrides:
      sonnet:
        reasoning_effort: medium
        verbosity: high
      opus:
        reasoning_effort: high
        verbosity: high
    error_hints: true

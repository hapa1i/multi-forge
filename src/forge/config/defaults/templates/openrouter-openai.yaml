# Template: openrouter-openai
# OpenAI models via OpenRouter (direct, no LiteLLM)
#
# OpenRouter serves standard GPT-6.2 models and their Pro variants.
# Requires OPENROUTER_API_KEY in .env (or environment).
#
# Haiku uses gpt-5.4-mini. Sonnet and Opus use gpt-6.2-astra,
# differentiated by tier_overrides (reasoning_effort and verbosity).

proxy:
  family: openai
  preferred_provider: openrouter
  backend: openrouter
  default_port: 8096

  openrouter:
    allow_non_zdr: false
    tiers:
      haiku: openai/gpt-5.4-mini
      sonnet: openai/gpt-6.2-astra
      opus: openai/gpt-6.2-astra
    model_alternatives:
      haiku:
        gpt-6-luna: openai/gpt-6-luna
        gpt-6-luna-pro: openai/gpt-6-luna-pro
      sonnet:
        gpt-6.2-sol: openai/gpt-6.2-sol
        gpt-6-astra: openai/gpt-6-astra
        gpt-6.2-sol-pro: openai/gpt-6.2-sol-pro
        gpt-6.2-astra-pro: openai/gpt-6.2-astra-pro
        gpt-6.1-sol: openai/gpt-6.1-sol
        gpt-6-sol: openai/gpt-6-sol
        gpt-6-sol-pro: openai/gpt-6-sol-pro
        gpt-6-luna: openai/gpt-6-luna
        gpt-6-luna-pro: openai/gpt-6-luna-pro
        gpt-5.6-sol: openai/gpt-5.6-sol
        gpt-6-astra-pro: openai/gpt-6-astra-pro
      opus:
        gpt-6.2-sol: openai/gpt-6.2-sol
        gpt-6-astra: openai/gpt-6-astra
        gpt-6.2-sol-pro: openai/gpt-6.2-sol-pro
        gpt-6.2-astra-pro: openai/gpt-6.2-astra-pro
        gpt-6.1-sol: openai/gpt-6.1-sol
        gpt-6-sol: openai/gpt-6-sol
        gpt-6-sol-pro: openai/gpt-6-sol-pro
        gpt-6-luna: openai/gpt-6-luna
        gpt-6-luna-pro: openai/gpt-6-luna-pro
        gpt-5.6-sol: openai/gpt-5.6-sol
        gpt-6-astra-pro: openai/gpt-6-astra-pro
    tier_overrides:
      sonnet:
        reasoning_effort: medium
        verbosity: high
      opus:
        reasoning_effort: high
        verbosity: high
    error_hints: true

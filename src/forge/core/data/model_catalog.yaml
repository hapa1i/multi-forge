    prompt_caching:
      # Probed via Forge's LiteLLM path on 1.88.0 (2026-07-26): repeated
      # ~2.8k-token identical prefix, 4 probes over 30s, cached_tokens
      # always 0 — no usable cache accounting despite Google/LiteLLM
      # metadata advertising support. Re-probe before flipping this.
      supports: false
